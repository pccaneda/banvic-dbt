models:
  - name: int_fato_contas
    description: Modelo intermediário do fato das contas.
    columns:
      - name: pk_conta
        description: Chave primária da tabela contas.
      - name: fk_cliente
        description: Chave estrangeira para tabela clientes.
      - name: fk_agencia
        description: Chave estrangeira para tabela agencias.
      - name: fk_colaborador
        description: Chave estrangeira para tabela colaborador.
      - name: saldo_total
        description: Saldo total da conta.
      - name: saldo_disponivel
        description: Saldo disponível na conta.
      - name: ts_ultimo_lancamento
        description: Timestamp da última movimentação da conta.