models:
  - name: stg_erp__colaboradores
    description: Modelo de staging para colaboradores.
    columns:
      - name: pk_colaborador
        description: Chave primária da tabela colaboradores.
      - name: fk_localidade
        description: Chave estrangeira para tabela localidades.
      - name: nome_colaborador
        description: Nome do colaborador obtido com primeiro e último nomes.
      - name: email_colaborador
        description: Email do colaborador.
      - name: cpf_colaborador
        description: CPF sanitizado do colaborador contendo apenas dígitos.
      - name: data_nascimento_colaborador
        description: Data de nascimento do colaborador.
      - name: endereco_colaborador
        description: Endereço completo do colaborador.
      - name: cep_colaborador
        description: Código CEP do endereço do colaborador.