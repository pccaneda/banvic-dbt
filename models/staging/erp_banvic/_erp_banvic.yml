sources:
  - name: erp
    description: Esse é o sistema ERP da Banvic com dados de clientes, colaboradores, contas e transações.
    schema: erp_banvic
    tables:
      - name: localidades
        description: Tabela fonte de localidades contendo informações de cidades e estados.

      - name: clientes
        description: Tabela fonte de clientes contendo informações pessoais de cada cliente da Banvic.

      - name: agencias
        description: Tabela fonte de agências contendo informações de cada agência da Banvic.