sources:
  - name: erp
    description: Esse é o sistema ERP da Banvic com dados de clientes, colaboradores, contas e transações.
    schema: erp_banvic
    tables:
      - name: localidades
        description: Tabela fonte de localidades com informações de cidade e estado.

      - name: clientes
        description: Tabela fonte de clientes com informações pessoais de cada cliente da Banvic.

      - name: agencias
        description: Tabela fonte de agências com dados sobre cada agência da Banvic.

      - name: colaboradores
        description: Tabela fonte de colaboradores com informações de cada colaborador da Banvic.